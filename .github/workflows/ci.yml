name: build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The web build is what the AMLOpcUa plugin bundles; the library build is
      # what another page imports.
      - uses: actions/upload-artifact@v4
        with:
          name: nodeset-js-dist
          path: dist
